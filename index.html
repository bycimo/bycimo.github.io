<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Order — ByCimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4F8FF;
      --card: #FFFFFF;
      --blue-soft: #DCEAFF;
      --blue-border: #C3DAFF;
      --blue-main: #2563EB;
      --blue-dark: #1E40AF;
      --mint-soft: #DCFCE7;
      --mint-ink: #15803D;
      --blue-badge: #DBEAFE;
      --blue-ink: #1D4ED8;
      --gray-badge: #F1F5F9;
      --gray-ink: #475569;
      --amber-soft: #FEF3C7;
      --amber-ink: #B45309;
      --ink: #0F172A;
      --muted: #64748B;
      --border: #DCE7F9;
      --red: #DC2626;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 56px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 248, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-pill {
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-box {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .menu-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.05);
    }

    .search-box input {
      flex: 1 1 170px;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--blue-main);
    }

    .btn-check {
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: var(--blue-main);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-check:hover {
      background: var(--blue-dark);
    }

    .btn-check:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--blue-border);
      background: var(--card);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--blue-border);
      background: var(--card);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:hover {
      background: var(--blue-soft);
    }

    .meta-line {
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .summary-card span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .summary-card strong {
      font-size: 14px;
    }

    .summary-sub {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
      margin-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: #F9FBFF;
    }

    td {
      padding: 14px 12px;
      border-bottom: 1px solid #EEF3FC;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-name { font-weight: 700; white-space: nowrap; }
    .col-batch { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .col-item { font-weight: 500; line-height: 1.4; min-width: 180px; }
    .col-qty { text-align: center; font-weight: 600; white-space: nowrap; }
    .col-co { text-align: center; white-space: nowrap; }
    .col-proof { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }

    .scroll-hint {
      text-align: right;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .b-arrive { background: var(--mint-soft); color: var(--mint-ink); }
    .b-otw { background: var(--blue-badge); color: var(--blue-ink); }
    .b-other { background: var(--gray-badge); color: var(--gray-ink); }

    .co-yes { background: var(--mint-soft); color: var(--mint-ink); }
    .co-no { background: var(--amber-soft); color: var(--amber-ink); }
    .co-none { background: var(--gray-badge); color: var(--gray-ink); }

    .num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .neg { color: var(--red); font-weight: 700; }
    .done-ok { color: var(--green); font-weight: 700; }

    .co-box {
      background: var(--card);
      border: 1px solid var(--blue-border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .co-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-dark);
    }

    .co-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }

    .co-label {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }

    .co-val {
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
      word-break: break-all;
    }

    .co-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .co-link-btn {
      padding: 6px 11px;
      border-radius: 8px;
      background: var(--blue-main);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
    }

    .co-link-btn:hover {
      background: var(--blue-dark);
    }

    .price-info-box {
      background: var(--card);
      border: 1px solid var(--blue-border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.04);
    }

    .price-info-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 4px;
    }

    .price-info-desc {
      font-size: 12px;
      color: var(--ink);
      line-height: 1.55;
    }

    .payment-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.04);
    }

    .payment-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .payment-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .qris-note {
      font-size: 11px;
      color: var(--muted);
    }

    .payment-due-banner {
      background: #F4F8FF;
      border: 1px solid var(--blue-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
    }

    .payment-due-banner strong {
      font-size: 14px;
      color: var(--blue-dark);
    }

    .bank-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    @media (max-width: 560px) {
      .bank-grid {
        grid-template-columns: 1fr;
      }
    }

    .bank-box {
      border: 1px solid var(--border);
      background: #F9FBFF;
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .bank-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .bank-acc {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .bank-holder {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .copy-btn {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--blue-border);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .qris-box {
      border: 1px solid var(--border);
      background: #F9FBFF;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qris-info {
      flex: 1 1 200px;
    }

    .qris-header-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .qris-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--blue-dark);
    }

    .qris-fee-bold {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .qris-desc {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.45;
    }

    .qris-thumb-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qris-thumb {
      width: 84px;
      height: 84px;
      object-fit: contain;
      background: #FFFFFF;
      border: 1px solid var(--blue-border);
      border-radius: 8px;
      padding: 4px;
      cursor: zoom-in;
    }

    .qris-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .qris-modal.open {
      display: flex;
    }

    .qris-modal-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .qris-modal-img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .qris-close-btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: var(--blue-main);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .tnc-box {
      background: #F9FBFF;
      border: 1px dashed var(--blue-border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11.5px;
      color: var(--ink);
      line-height: 1.55;
    }

    .tnc-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--blue-dark);
      margin-bottom: 4px;
    }

    .tnc-list {
      padding-left: 16px;
      color: var(--muted);
    }

    .tnc-list li {
      margin-bottom: 2px;
    }

    .tnc-list li:last-child {
      margin-bottom: 0;
    }

    .confirm-wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      background: #16A34A;
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
    }

    .confirm-wa-btn:hover {
      background: #15803D;
    }

    .state-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .debug-note {
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      word-break: break-word;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand-pill" id="brandPill" onclick="resetView(event)">ByCimo</a>
    <div class="top-actions">
      <div class="lang-box">
        <button type="button" class="lang-btn" id="langEN" onclick="changeLang('en')">EN</button>
        <button type="button" class="lang-btn active" id="langID" onclick="changeLang('id')">ID</button>
      </div>
      <button type="button" class="menu-btn" onclick="focusInput()" aria-label="Search">≡</button>
    </div>
  </header>

  <main class="container">
    <form class="search-box" onsubmit="event.preventDefault(); searchOrders();">
      <input type="text" id="nameInput" placeholder="Nama pembeli..." autocomplete="off" />
      <input type="email" id="emailInput" placeholder="Email pembeli..." autocomplete="off" />
      <input type="text" id="arrivedInput" placeholder="Tgl arrived (cth: 15 nov)..." autocomplete="off" />
      <button type="submit" class="btn-check" id="checkBtn">Cek Order</button>
    </form>

    <div class="toolbar">
      <select class="filter-select" id="statusFilter" onchange="renderOrders()">
        <option value="not_done">Status: Not Done</option>
        <option value="all">Status: All</option>
        <option value="done">Status: Done</option>
      </select>

      <div class="action-links">
        <a class="pill-btn" id="igBtn" href="https://www.instagram.com/bycimo/" target="_blank" rel="noopener">
          <span>📸</span> <span>@bycimo</span>
        </a>
        <a class="pill-btn" id="adminBtn" href="#" target="_blank" rel="noopener">
          <span>💬</span> <span id="adminLabel">Ask Admin</span>
        </a>
      </div>
    </div>

    <div id="contentArea">
      <div class="state-box" id="welcomeBox">Masukkan <b>Nama</b> dan <b>Email</b> pembeli, atau ketik <b>Tgl arrived</b> (contoh: <code>15 nov</code>) lalu tekan <b>Cek Order</b>.</div>
    </div>
  </main>

  <div class="qris-modal" id="qrisModal" onclick="closeQrisModal(event)">
    <div class="qris-modal-card" onclick="event.stopPropagation()">
      <img class="qris-modal-img" id="qrisModalImg" src="./ID1021081861168%202.jpeg" alt="Barcode QRIS" />
      <button type="button" class="qris-close-btn" id="qrisCloseBtn" onclick="closeQrisModal()">Tutup</button>
    </div>
  </div>

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/\r?\n/g, " ");
    }

    function focusInput() {
      const el = document.getElementById("nameInput");
      el.focus();
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function openQrisModal() {
      const cleanUrl = sanitizeImageUrl(QRIS_IMAGE_URL);
      if (!cleanUrl) return;
      document.getElementById("qrisModalImg").src = cleanUrl;
      document.getElementById("qrisModal").classList.add("open");
    }

    function closeQrisModal(e) {
      if (e && e.target !== document.getElementById("qrisModal") && e.target !== document.getElementById("qrisCloseBtn")) return;
      document.getElementById("qrisModal").classList.remove("open");
    }

    function resetView(e) {
      if (e) e.preventDefault();
      lastQueryLabel = "";
      ordersData = [];
      document.getElementById("nameInput").value = "";
      document.getElementById("emailInput").value = "";
      document.getElementById("arrivedInput").value = "";
      document.getElementById("contentArea").innerHTML = `<div class="state-box">${TEXT[currentLang].welcome}</div>`;
    }

    function changeLang(lang) {
      currentLang = lang;
      document.getElementById("langID").classList.toggle("active", lang === "id");
      document.getElementById("langEN").classList.toggle("active", lang === "en");

      const t = TEXT[lang];
      document.getElementById("nameInput").placeholder = t.namePlaceholder;
      document.getElementById("emailInput").placeholder = t.emailPlaceholder;
      document.getElementById("arrivedInput").placeholder = t.arrivedPlaceholder;
      document.getElementById("checkBtn").textContent = t.check;
      document.getElementById("adminLabel").textContent = t.admin;
      document.getElementById("qrisCloseBtn").textContent = t.qrisClose;

      const sel = document.getElementById("statusFilter");
      sel.options[0].text = t.notDone;
      sel.options[1].text = t.all;
      sel.options[2].text = t.done;

      if (lastQueryLabel) {
        renderOrders();
      } else {
        document.getElementById("contentArea").innerHTML = `<div class="state-box">${t.welcome}</div>`;
      }
    }

    function copyText(val, btnEl, fallbackLabel) {
      const t = TEXT[currentLang];
      const textToCopy = String(val || "");
      if (!textToCopy) return;

      const onCopied = () => {
        const prev = btnEl.textContent;
        btnEl.textContent = t.copied;
        setTimeout(() => {
          btnEl.textContent = fallbackLabel || prev || t.copy;
        }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(onCopied).catch(() => {
          fallbackCopy(textToCopy, onCopied);
        });
      } else {
        fallbackCopy(textToCopy, onCopied);
      }
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        cb();
      } catch (e) {}
      document.body.removeChild(ta);
    }

    function parseNum(val) {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      const cleaned = String(val || "0")
        .replace(/rp/gi, "")
        .replace(/\s+/g, "")
        .replace(/,/g, "")
        .trim();
      if (!cleaned) return 0;
      const n = Number(cleaned);
      if (!isNaN(n)) return n;
      const dotCleaned = cleaned.replace(/\./g, "");
      const n2 = Number(dotCleaned);
      return isNaN(n2) ? 0 : n2;
    }

    function formatIDR(val) {
      const num = parseNum(val);
      const prefix = num < 0 ? "-Rp " : "Rp ";
      return prefix + Math.abs(num).toLocaleString("id-ID");
    }

    function pickField(row, keys, fallback = "") {
      for (const k of keys) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
          return row[k];
        }
      }
      const lowerMap = {};
      Object.keys(row || {}).forEach(origKey => {
        lowerMap[origKey.toLowerCase().replace(/[^a-z0-9]/g, "")] = row[origKey];
      });
      for (const k of keys) {
        const norm = k.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (lowerMap[norm] !== undefined && lowerMap[norm] !== null && String(lowerMap[norm]).trim() !== "") {
          return lowerMap[norm];
        }
      }
      return fallback;
    }

    function isArrivedIna(status) {
      const s = String(status || "").trim().toLowerCase().replace(/\s+/g, " ");
      return s === "arrived ina" || s.includes("arrived ina") || s === "arrived_ina" || s === "arrivedina";
    }

    function statusBadgeClass(status) {
      const s = String(status || "").toLowerCase();
      if (isArrivedIna(s) || s.includes("arriv") || s.includes("indo") || s.includes("ready")) return "b-arrive";
      if (s.includes("otw") || s.includes("ship") || s.includes("flight") || s.includes("sea") || s.includes("wh")) return "b-otw";
      return "b-other";
    }

    function normalizeCoFlag(val) {
      const raw = String(val || "").trim();
      if (!raw) return { label: "-", cls: "co-none" };
      const low = raw.toLowerCase();
      if (low === "yes" || low === "y" || low === "sudah" || low === "ya" || low === "true" || low === "done") {
        return { label: raw.toUpperCase(), cls: "co-yes" };
      }
      if (low === "no" || low === "n" || low === "belum" || low === "false") {
        return { label: raw.toUpperCase(), cls: "co-no" };
      }
      return { label: raw, cls: "co-none" };
    }

    function normalizeDateText(val) {
      const monthMap = {
        januari: "jan", feb: "feb", februari: "feb",
        mar: "mar", maret: "mar", apr: "apr", april: "apr",
        mei: "may", jun: "jun", juni: "jun",
        jul: "jul", juli: "jul", agu: "aug", agustus: "aug",
        sep: "sep", sept: "sep", september: "sep",
        okt: "oct", oktober: "oct",
        nov: "nov", november: "nov",
        des: "dec", desember: "dec"
      };
      let s = String(val || "")
        .toLowerCase()
        .replace(/\b(arrived|tgl|tanggal|ina|batch)\b/g, " ")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      s = s.split(" ").map(tok => monthMap[tok] || tok).join(" ");
      return s;
    }

    function rowContainsDateNeedle(row, aNeedle) {
      if (!aNeedle) return true;
      const values = Object.values(row || {}).filter(v => v !== null && v !== undefined);
      return values.some(v => normalizeDateText(v).includes(aNeedle));
    }

    function matchesQuery(row, nameQ, emailQ, arrivedQ) {
      const nNeedle = nameQ.toLowerCase();
      const eNeedle = emailQ.toLowerCase();
      const aNeedle = normalizeDateText(arrivedQ);

      const nameVal = String(pickField(row, ["Nama Depan", "namaDepan", "nama", "name"], "")).trim().toLowerCase();
      const emailVal = String(pickField(row, ["Email", "email", "mail"], "")).trim().toLowerCase();

      if (aNeedle && !nNeedle && !eNeedle) {
        return rowContainsDateNeedle(row, aNeedle);
      }

      const nameOk = !nNeedle || nameVal.includes(nNeedle);
      const emailOk = !eNeedle || emailVal.includes(eNeedle);
      const arrivedOk = !aNeedle || rowContainsDateNeedle(row, aNeedle);

      return nameOk && emailOk && arrivedOk;
    }

    function sanitizeExternalUrl(url) {
      const raw = String(url || "").trim().replace(/\s+/g, "");
      if (!raw) return "";
      if (/^(javascript|data|vbscript|file):/i.test(raw)) return "";
      if (/^https?:\/\//i.test(raw)) return raw;
      if (/^\/\//.test(raw)) return "https:" + raw;
      return "https://" + raw.replace(/^\/+/, "");
    }

    function sanitizeImageUrl(url) {
      const raw = String(url || "").trim();
