<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Order — ByCimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4F8FD;
      --surface: #FFFFFF;
      --blue-soft: #DCEAFE;
      --blue-accent: #2563EB;
      --blue-dark: #1E3A8A;
      --blue-border: #BFDBFE;
      --arrive-badge: #D1FAE5;
      --arrive-text: #065F46;
      --otw-badge: #E0E7FF;
      --otw-text: #3730A3;
      --gray-badge: #F1F5F9;
      --gray-text: #475569;
      --ink: #0F172A;
      --muted: #64748B;
      --line: #E2E8F0;
      --red: #DC2626;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(244, 248, 253, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-pill {
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--blue-border);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .brand-logo-svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ig-pill {
      background: var(--surface);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--blue-border);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .ig-pill:hover {
      background: var(--blue-soft);
      border-color: #93C5FD;
    }

    .ig-icon-svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
    }

    .lang-btn.active {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .menu-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.05);
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .search-grid {
        grid-template-columns: 1fr;
      }
      .ig-handle-text {
        display: none;
      }
    }

    .search-grid input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-grid input:focus {
      border-color: var(--blue-accent);
    }

    .btn-primary {
      width: 100%;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      background: var(--blue-dark);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #CBD5E1;
      background: var(--surface);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      outline: none;
      cursor: pointer;
    }

    .ask-admin-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid #93C5FD;
      background: var(--surface);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .showing-text {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 560px) {
      .summary-strip {
        grid-template-columns: 1fr;
      }
    }

    .summary-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .summary-box span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .summary-box strong {
      font-size: 14px;
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 660px;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 0.4px;
      color: var(--muted);
      text-transform: uppercase;
      padding: 12px 12px;
      border-bottom: 1px solid var(--line);
      background: #F8FAFC;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #F1F5F9;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .name-cell {
      font-weight: 700;
      white-space: nowrap;
    }

    .batch-cell {
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }

    .item-cell {
      font-weight: 500;
      line-height: 1.35;
    }

    .qty-cell {
      text-align: center;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
