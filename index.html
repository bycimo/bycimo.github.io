<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Order - ByCimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4F8FD;
      --surface: #FFFFFF;
      --blue-soft: #DCEAFE;
      --blue-accent: #2563EB;
      --blue-dark: #1E3A8A;
      --blue-border: #BFDBFE;
      --arrive-badge: #D1FAE5;
      --arrive-text: #065F46;
      --otw-badge: #E0E7FF;
      --otw-text: #3730A3;
      --gray-badge: #F1F5F9;
      --gray-text: #475569;
      --ink: #0F172A;
      --muted: #64748B;
      --line: #E2E8F0;
      --red: #DC2626;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(244, 248, 253, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .brand-pill {
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--blue-border);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .brand-logo-svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .ig-pill {
      background: var(--surface);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid var(--blue-border);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .ig-pill:hover {
      background: var(--blue-soft);
      border-color: #93C5FD;
    }

    .ig-icon-svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
    }

      background: transparent;
      font-size: 11
