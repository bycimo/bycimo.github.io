<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Order — bycimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFF9FA;
      --card: #FFFFFF;
      --pink: #F7D6DF;
      --pink-badge: #F5C2D1;
      --pink-ink: #9D3758;
      --blue-badge: #DBEAFE;
      --blue-ink: #1D4ED8;
      --gray-badge: #F1F3F5;
      --gray-ink: #495057;
      --ink: #221E20;
      --muted: #766E71;
      --border: #F0E3E7;
      --red: #DC2626;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 249, 250, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-pill {
      background: var(--pink);
      color: var(--ink);
      font-weight: 700;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-box {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--pink);
      color: var(--ink);
    }

    .menu-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--pink);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(157, 55, 88, 0.04);
    }

    .search-box input {
      flex: 1;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #E6D5DA;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    .search-box input:focus {
      border-color: #D48CA3;
    }

    .btn-check {
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: var(--ink);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-check:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #E6D5DA;
      background: var(--card);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid #EAB5C5;
      background: var(--card);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-line {
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 10px;
