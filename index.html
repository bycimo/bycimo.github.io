<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tracking Order — bycimo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F4F8FF;
      --card: #FFFFFF;
      --blue-soft: #DCEAFF;
      --blue-border: #C3DAFF;
      --blue-main: #2563EB;
      --blue-dark: #1E40AF;
      --pink-badge: #FCE7F3;
      --pink-ink: #9D174D;
      --blue-badge: #DBEAFE;
      --blue-ink: #1D4ED8;
      --gray-badge: #F1F5F9;
      --gray-ink: #475569;
      --ink: #0F172A;
      --muted: #64748B;
      --border: #DCE7F9;
      --red: #DC2626;
      --green: #16A34A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 248, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-pill {
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-box {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .menu-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .search-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.05);
    }

    .search-box input {
      flex: 1 1 190px;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--blue-border);
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--blue-main);
    }

    .btn-check {
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      background: var(--blue-main);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-check:hover {
      background: var(--blue-dark);
    }

    .btn-check:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--blue-border);
      background: var(--card);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .action-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--blue-border);
      background: var(--card);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:hover {
      background: var(--blue-soft);
    }

    .meta-line {
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
    }

    .summary-card span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .summary-card strong {
      font-size: 14px;
    }

    .payment-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .payment-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 10px;
    }

    .bank-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 560px) {
      .bank-grid {
        grid-template-columns: 1fr;
      }
    }

    .bank-box {
      border: 1px solid var(--border);
      background: #F9FBFF;
      border-radius: 12px;
      padding: 11px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .bank-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .bank-acc {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .bank-holder {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .copy-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--blue-border);
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
      font-size: 13px;
    }

    th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      padding: 12px;
      border-bottom: 1px solid var(--border);
      background: #F9FBFF;
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #EEF3FC;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-name { font-weight: 700; white-space: nowrap; }
    .col-batch { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .col-item { font-weight: 500; line-height: 1.35; }
    .col-qty { text-align: center; font-weight: 600; white-space: nowrap; }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .b-arrive { background: var(--pink-badge); color: var(--pink-ink); }
    .b-otw { background: var(--blue-badge); color: var(--blue-ink); }
    .b-other { background: var(--gray-badge); color: var(--gray-ink); }

    .num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .neg { color: var(--red); font-weight: 700; }
    .done-ok { color: var(--green); font-weight: 700; }

    .state-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="#" class="brand-pill" id="brandPill" onclick="resetView(event)">bycimo</a>
    <div class="top-actions">
      <div class="lang-box">
        <button type="button" class="lang-btn" id="langEN" onclick="changeLang('en')">EN</button>
        <button type="button" class="lang-btn active" id="langID" onclick="changeLang('id')">ID</button>
      </div>
      <button type="button" class="menu-btn" onclick="focusInput()" aria-label="Search">≡</button>
    </div>
  </header>

  <main class="container">
    <form class="search-box" onsubmit="event.preventDefault(); searchOrders();">
      <input type="text" id="nameInput" placeholder="Nama pembeli..." autocomplete="off" />
      <input type="email" id="emailInput" placeholder="Email pembeli..." autocomplete="off" />
      <button type="submit" class="btn-check" id="checkBtn">Cek Order</button>
    </form>

    <div class="toolbar">
      <select class="filter-select" id="statusFilter" onchange="renderOrders()">
        <option value="not_done">Status: Not Done</option>
        <option value="all">Status: All</option>
        <option value="done">Status: Done</option>
      </select>

      <div class="action-links">
        <a class="pill-btn" id="igBtn" href="https://www.instagram.com/bycimo/" target="_blank" rel="noopener">
          <span>📸</span> <span>@bycimo</span>
        </a>
        <a class="pill-btn" id="adminBtn" href="#" target="_blank" rel="noopener">
          <span>💬</span> <span id="adminLabel">Ask Admin</span>
        </a>
      </div>
    </div>

    <div id="contentArea">
      <div class="state-box" id="welcomeBox">Masukkan <b>Nama</b> dan <b>Email</b> pembeli lalu tekan <b>Cek Order</b> untuk melihat status barang dan pelunasan.</div>
    </div>
  </main>

  <script>
    // === KONFIGURASI UTAMA ===
    const API_URL = "PASTE_URL_WEB_APP_KAMU_DI_SINI";
    const ADMIN_WA = "6285810117201";
    const BRAND_NAME = "bycimo";
    const IG_URL = "https://www.instagram.com/bycimo/";

    const PAYMENT_INFO = {
      bca: {
        label: "Bank BCA",
        account: "8555129579",
        holder: "a.n. N A"
      },
      seabank: {
        label: "SeaBank",
        account: "901061923808",
        holder: "a.n. N A"
      }
    };
    // =========================

    let currentLang = "id";
    let ordersData = [];
    let lastQueryLabel = "";

    const TEXT = {
      id: {
        namePlaceholder: "Nama pembeli...",
        emailPlaceholder: "Email pembeli...",
        check: "Cek Order",
        loading: "Mencari data...",
        admin: "Ask Admin",
        notDone: "Status: Not Done",
        all: "Status: All",
        done: "Status: Done",
        welcome: 'Masukkan <b>Nama</b> dan <b>Email</b> pembeli lalu tekan <b>Cek Order</b> untuk melihat status barang dan pelunasan.',
        missingBoth: "Masukkan Nama dan Email pembeli terlebih dahulu.",
        missingApi: "URL Google Apps Script (<code>API_URL</code>) belum diisi pada file <code>index.html</code>.",
        fetchErr: "Gagal mengambil data dari Google Sheets. Pastikan Web App sudah di-deploy dengan akses <b>Anyone</b>.",
        notFound: "Data order tidak ditemukan untuk kombinasi nama, email, atau filter tersebut.",
        showing: (a, b, q) => `Menampilkan ${a} dari ${b} order untuk ${q}`,
        sumDue: "Sisa Pelunasan",
        sumTotal: "Total Nominal",
        payTitle: "Informasi Pembayaran (BCA & SeaBank)",
        copy: "Salin",
        copied: "Tersalin",
        thName: "NAMA",
        thBatch: "BATCH",
        thItem: "ITEM",
        thQty: "QTY",
        thStatus: "STATUS",
        thPaid: "DP / PAID",
        thDue: "PELUNASAN",
        thTotal: "TOTAL"
      },
      en: {
        namePlaceholder: "Buyer name...",
        emailPlaceholder: "Buyer email...",
        check: "Check Order",
        loading: "Searching...",
        admin: "Ask Admin",
        notDone: "Status: Not Done",
        all: "Status: All",
        done: "Status: Done",
        welcome: 'Enter both buyer <b>Name</b> and <b>Email</b> and tap <b>Check Order</b> to view item status and balance.',
        missingBoth: "Please enter both buyer Name and Email.",
        missingApi: "Google Apps Script URL (<code>API_URL</code>) is not set in <code>index.html</code>.",
        fetchErr: "Failed to load data from Google Sheets. Make sure Web App access is set to <b>Anyone</b>.",
        notFound: "No orders found for this name, email, or filter.",
        showing: (a, b, q) => `Showing ${a} of ${b} orders for ${q}`,
        sumDue: "Balance Due",
        sumTotal: "Total Amount",
        payTitle: "Payment Details (BCA & SeaBank)",
        copy: "Copy",
        copied: "Copied",
        thName: "NAME",
        thBatch: "BATCH",
        thItem: "ITEM",
        thQty: "QTY",
        thStatus: "STATUS",
        thPaid: "DP / PAID",
        thDue: "BALANCE",
        thTotal: "TOTAL"
      }
    };

    document.getElementById("brandPill").textContent = BRAND_NAME;
    document.getElementById("igBtn").href = IG_URL;
    document.getElementById("adminBtn").href = `https://wa.me/${ADMIN_WA}?text=${encodeURIComponent("Halo min, mau tanya soal orderanku")}`;

    function focusInput() {
      const el = document.getElementById("nameInput");
      el.focus();
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetView(e) {
      if (e) e.preventDefault();
      lastQueryLabel = "";
      ordersData = [];
      document.getElementById("nameInput").value = "";
      document.getElementById("emailInput").value = "";
      document.getElementById("contentArea").innerHTML = `<div class="state-box">${TEXT[currentLang].welcome}</div>`;
    }

    function changeLang(lang) {
      currentLang = lang;
      document.getElementById("langID").classList.toggle("active", lang === "id");
      document.getElementById("langEN").classList.toggle("active", lang === "en");

      const t = TEXT[lang];
      document.getElementById("nameInput").placeholder = t.namePlaceholder;
      document.getElementById("emailInput").placeholder = t.emailPlaceholder;
      document.getElementById("checkBtn").textContent = t.check;
      document.getElementById("adminLabel").textContent = t.admin;

      const sel = document.getElementById("statusFilter");
      sel.options[0].text = t.notDone;
      sel.options[1].text = t.all;
      sel.options[2].text = t.done;

      if (lastQueryLabel) {
        renderOrders();
      } else {
        document.getElementById("contentArea").innerHTML = `<div class="state-box">${t.welcome}</div>`;
      }
    }

    function copyAccount(accText, btnEl) {
      const t = TEXT[currentLang];
      navigator.clipboard.writeText(accText).then(() => {
        const prev = btnEl.textContent;
        btnEl.textContent = t.copied;
        setTimeout(() => {
          btnEl.textContent = prev || t.copy;
        }, 1500);
      });
    }

    function parseNum(val) {
      if (typeof val === "number") return isNaN(val) ? 0 : val;
      const cleaned = String(val || "0")
        .replace(/rp/gi, "")
        .replace(/\s+/g, "")
        .replace(/,/g, "")
        .trim();
      if (!cleaned) return 0;
      const n = Number(cleaned);
      if (!isNaN(n)) return n;
      const dotCleaned = cleaned.replace(/\./g, "");
      const n2 = Number(dotCleaned);
      return isNaN(n2) ? 0 : n2;
    }

    function formatIDR(val) {
      const num = parseNum(val);
      const prefix = num < 0 ? "-Rp " : "Rp ";
      return prefix + Math.abs(num).toLocaleString("id-ID");
    }

    function pickField(row, keys, fallback = "") {
      for (const k of keys) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") {
          return row[k];
        }
      }
      const lowerMap = {};
      Object.keys(row || {}).forEach(origKey => {
        lowerMap[origKey.toLowerCase().replace(/[^a-z0-9]/g, "")] = row[origKey];
      });
      for (const k of keys) {
        const norm = k.toLowerCase().replace(/[^a-z0-9]/g, "");
        if (lowerMap[norm] !== undefined && lowerMap[norm] !== null && String(lowerMap[norm]).trim() !== "") {
          return lowerMap[norm];
        }
      }
      return fallback;
    }

    function statusBadgeClass(status) {
      const s = String(status || "").toLowerCase();
      if (s.includes("arriv") || s.includes("indo") || s.includes("ready") || s.includes("wh")) return "b-arrive";
      if (s.includes("otw") || s.includes("ship") || s.includes("flight") || s.includes("sea")) return "b-otw";
      return "b-other";
    }

    function matchesNameAndEmail(row, nameQ, emailQ) {
      const nNeedle = nameQ.toLowerCase();
      const eNeedle = emailQ.toLowerCase();
      const nameVal = String(pickField(row, ["Nama Depan", "namaDepan", "nama", "name"], "")).trim().toLowerCase();
      const emailVal = String(pickField(row, ["Email", "email", "mail"], "")).trim().toLowerCase();
      return nameVal.includes(nNeedle) && emailVal === eNeedle;
    }

    async function searchOrders() {
      const t = TEXT[currentLang];
      const nameQ = document.getElementById("nameInput").value.trim();
      const emailQ = document.getElementById("emailInput").value.trim();
      const area = document.getElementById("contentArea");
      const btn = document.getElementById("checkBtn");

      if (!nameQ || !emailQ) {
        area.innerHTML = `<div class="state-box">${t.missingBoth}</div>`;
        return;
      }

      if (!API_URL || API_URL.includes("https://script.google.com/macros/s/AKfycbxnZPgxaTI94h3RvHZi2aoslUrQaxz2pytbM5Kv66rT1EzGi8-xALyQbVABpWSt9cOOKQ/exec")) {
        area.innerHTML = `<div class="state-box">${t.missingApi}</div>`;
        return;
      }

      btn.disabled = true;
      btn.textContent = t.loading;

      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (Array.isArray(data.data) ? data.data : []);
        lastQueryLabel = `"${nameQ}" & "${emailQ}"`;
        ordersData = rows.filter(r => matchesNameAndEmail(r, nameQ, emailQ));
        renderOrders();
      } catch (err) {
        area.innerHTML = `<div class="state-box">${t.fetchErr}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = TEXT[currentLang].check;
      }
    }

    function renderOrders() {
      const t = TEXT[currentLang];
      const area = document.getElementById("contentArea");
      const filter = document.getElementById("statusFilter").value;

      const filtered = ordersData.filter(item => {
        const doneFlag = String(pickField(item, ["DONE", "done", "statusDone"], "")).trim().toLowerCase();
        const isDone = doneFlag === "yes" || doneFlag === "done" || doneFlag === "true" || doneFlag === "lunas";
        if (filter === "not_done") return !isDone;
        if (filter === "done") return isDone;
        return true;
      });

      if (filtered.length === 0) {
        area.innerHTML = `<div class="state-box">${t.notFound}</div>`;
        return;
      }

      let totalDue = 0;
      let totalAmt = 0;

      const rowsHtml = filtered.map(item => {
        const nama = pickField(item, ["Nama Depan", "namaDepan", "nama", "name"], "-");
        const batch = pickField(item, ["Batch", "batch"], "-");
        const brg = pickField(item, ["Item", "item", "barang"], "-");
        const qty = pickField(item, ["Jumlah (QTY)", "jumlahQty", "qty", "jumlah"], "-");
        const status = pickField(item, ["Status", "status"], "-");
        const paid = parseNum(pickField(item, ["DP", "dp", "sudahBayar", "paid"], 0));
        const total = parseNum(pickField(item, ["Total", "total"], 0));
        const rawDue = pickField(item, ["Pelunasan", "pelunasan", "balance"], null);
        const due = rawDue !== null ? parseNum(rawDue) : (total - paid);

        totalDue += due;
        totalAmt += total;

        const dueClass = due < 0 ? "neg" : (due === 0 ? "done-ok" : "");
        const badgeCls = statusBadgeClass(status);

        return `
          <tr>
            <td class="col-name">${nama}</td>
            <td class="col-batch">${batch}</td>
            <td class="col-item">${brg}</td>
            <td class="col-qty">${qty}</td>
            <td><span class="badge ${badgeCls}">${status}</span></td>
            <td class="num">${formatIDR(paid)}</td>
            <td class="num ${dueClass}">${formatIDR(due)}</td>
            <td class="num">${total === 0 ? "-" : formatIDR(total)}</td>
          </tr>
        `;
      }).join("");

      area.innerHTML = `
        <div class="meta-line">${t.showing(filtered.length, ordersData.length, lastQueryLabel)}</div>
        <div class="summary-grid">
          <div class="summary-card">
            <span>${t.sumDue}</span>
            <strong class="${totalDue < 0 ? "neg" : (totalDue === 0 ? "done-ok" : "")}">${formatIDR(totalDue)}</strong>
          </div>
          <div class="summary-card">
            <span>${t.sumTotal}</span>
            <strong>${formatIDR(totalAmt)}</strong>
          </div>
        </div>
        <div class="payment-card">
          <div class="payment-title">${t.payTitle}</div>
          <div class="bank-grid">
            <div class="bank-box">
              <div>
                <div class="bank-name">${PAYMENT_INFO.bca.label}</div>
                <div class="bank-acc">${PAYMENT_INFO.bca.account}</div>
                <div class="bank-holder">${PAYMENT_INFO.bca.holder}</div>
              </div>
              <button type="button" class="copy-btn" onclick="copyAccount('${PAYMENT_INFO.bca.account}', this)">${t.copy}</button>
            </div>
            <div class="bank-box">
              <div>
                <div class="bank-name">${PAYMENT_INFO.seabank.label}</div>
                <div class="bank-acc">${PAYMENT_INFO.seabank.account}</div>
                <div class="bank-holder">${PAYMENT_INFO.seabank.holder}</div>
              </div>
              <button type="button" class="copy-btn" onclick="copyAccount('${PAYMENT_INFO.seabank.account}', this)">${t.copy}</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
